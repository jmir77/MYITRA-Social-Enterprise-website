openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: enquiries
    description: Website contact / enquiry form submissions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /enquiries:
    post:
      operationId: createEnquiry
      tags: [enquiries]
      summary: Submit an enquiry from the website contact form
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnquiryInput"
      responses:
        "201":
          description: Enquiry received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enquiry"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    EnquiryInterest:
      type: string
      enum:
        - Volunteering
        - Sponsoring Kotak Cantik
        - Corporate Partnership
        - Donating
        - General Enquiry
    EnquiryInput:
      type: object
      required: [fullName, email, interest, message]
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 320
        phone:
          type: string
          maxLength: 50
        interest:
          $ref: "#/components/schemas/EnquiryInterest"
        message:
          type: string
          minLength: 1
          maxLength: 5000
    Enquiry:
      type: object
      required: [id, fullName, email, interest, message, createdAt]
      properties:
        id:
          type: integer
        fullName:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        interest:
          $ref: "#/components/schemas/EnquiryInterest"
        message:
          type: string
        createdAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
