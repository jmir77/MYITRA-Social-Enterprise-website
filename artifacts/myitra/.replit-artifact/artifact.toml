kind = "web"
previewPath = "/"
title = "MYITRA Social Enterprise"
description = "Official website for MYITRA Social Enterprise under INTI International College Subang, Malaysia. A long-scroll home page covering vision, mission, impact, SDGs, TUNAS accreditation, programmes and ways to get involved, plus a dedicated Kotak Cantik page and an enquiry form."
version = "1.0.0"
id = "artifacts/myitra"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19106

[services.development]
run = "pnpm --filter @workspace/myitra run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/myitra", "run", "build" ]
serve = "static"
publicDir = "artifacts/myitra/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19106"
BASE_PATH = "/"
